<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no,
                 viewport-fit=cover"
    >

    <meta name="theme-color" content="#111111">

    <title>Mic Controller</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;
            overscroll-behavior: none;

            user-select: none;
            -webkit-user-select: none;

            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            position: fixed;
            inset: 0;

            width: 100vw;
            height: 100dvh;

            background: #111;
            color: white;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            touch-action: none;
        }

        .app {
            width: 100%;
            height: 100%;

            display: flex;
            flex-direction: column;

            padding:
                max(18px, env(safe-area-inset-top))
                20px
                max(18px, env(safe-area-inset-bottom))
                20px;
        }

        .header {
            text-align: center;
            flex-shrink: 0;
        }

        h1 {
            margin: 0;

            font-size: clamp(
                24px,
                7vw,
                34px
            );
        }

        #status {
            margin-top: 8px;

            font-size: clamp(
                16px,
                4.5vw,
                20px
            );

            font-weight: bold;
        }

        #volumeDisplay {
            margin-top: 8px;

            font-size: clamp(
                15px,
                4vw,
                18px
            );

            opacity: 0.8;
        }

        .controls {
            flex: 1;

            display: grid;

            grid-template-rows:
                0.7fr
                1fr
                1fr
                1fr;

            gap: 14px;

            padding-top: 18px;

            min-height: 0;
        }

        button {
            width: 100%;
            height: 100%;

            min-height: 0;

            border: none;
            border-radius: 22px;

            font-size: clamp(
                24px,
                7vw,
                34px
            );

            font-weight: 700;

            color: white;

            touch-action: manipulation;

            cursor: pointer;
        }

        button:active {
            transform: scale(0.97);
        }

        button:disabled {
            opacity: 0.35;
        }

        #connectButton {
            background: #1976d2;
        }

        #volumeUpButton {
            background: #2e7d32;
        }

        #volumeDownButton {
            background: #1565c0;
        }

        #muteButton {
            background: #c62828;
        }

        #muteButton.muted {
            background: #616161;
        }

    </style>
</head>


<body>

<div class="app">

    <div class="header">

        <h1>
            Mic Controller
        </h1>

        <div id="status">
            🔴 Disconnected
        </div>

        <div id="volumeDisplay">
            Volume Control Ready
        </div>

    </div>


    <div class="controls">

        <button
            id="connectButton"
            onclick="connectBLE()"
        >
            CONNECT
        </button>


        <button
            id="volumeUpButton"
            onclick="sendCommand(1)"
            disabled
        >
            VOLUME +
        </button>


        <button
            id="volumeDownButton"
            onclick="sendCommand(2)"
            disabled
        >
            VOLUME −
        </button>


        <button
            id="muteButton"
            onclick="toggleMute()"
            disabled
        >
            MUTE
        </button>

    </div>

</div>


<script>

    // ==================================================
    // BLE UUIDs
    //
    // These MUST match the ESP32 code.
    // ==================================================

    const SERVICE_UUID =
        "12345678-1234-1234-1234-123456789000";

    const CONTROL_UUID =
        "12345678-1234-1234-1234-123456789001";


    // ==================================================
    // BLE objects
    // ==================================================

    let device = null;

    let server = null;

    let controlCharacteristic = null;

    let muted = false;


    // ==================================================
    // Elements
    // ==================================================

    const statusElement =
        document.getElementById(
            "status"
        );

    const volumeDisplay =
        document.getElementById(
            "volumeDisplay"
        );

    const connectButton =
        document.getElementById(
            "connectButton"
        );

    const volumeUpButton =
        document.getElementById(
            "volumeUpButton"
        );

    const volumeDownButton =
        document.getElementById(
            "volumeDownButton"
        );

    const muteButton =
        document.getElementById(
            "muteButton"
        );


    // ==================================================
    // Connect
    // ==================================================

    async function connectBLE() {

        if (!navigator.bluetooth) {

            statusElement.innerHTML =
                "❌ Bluetooth unsupported";

            volumeDisplay.innerHTML =
                "Use Android Chrome or a Web Bluetooth browser.";

            return;
        }


        try {

            statusElement.innerHTML =
                "🟡 Searching...";


            // Open Bluetooth picker
            device =
                await navigator.bluetooth
                    .requestDevice({

                        filters: [

                            {
                                name:
                                    "Mic Controller"
                            }

                        ],

                        optionalServices: [
                            SERVICE_UUID
                        ]

                    });


            device.addEventListener(
                "gattserverdisconnected",
                handleDisconnect
            );


            statusElement.innerHTML =
                "🟡 Connecting...";


            server =
                await device.gatt.connect();


            const service =
                await server
                    .getPrimaryService(
                        SERVICE_UUID
                    );


            controlCharacteristic =
                await service
                    .getCharacteristic(
                        CONTROL_UUID
                    );


            // Connected
            statusElement.innerHTML =
                "🟢 Connected";


            volumeDisplay.innerHTML =
                device.name ||
                "Mic Controller";


            connectButton.innerHTML =
                "CONNECTED";

            connectButton.disabled =
                true;


            enableControls();


        }

        catch (error) {

            console.error(
                error
            );


            if (
                error.name ===
                "NotFoundError"
            ) {

                statusElement.innerHTML =
                    "🔴 Connection cancelled";

            }

            else {

                statusElement.innerHTML =
                    "🔴 Connection failed";


                volumeDisplay.innerHTML =
                    error.message;

            }
        }
    }


    // ==================================================
    // Send BLE command
    // ==================================================

    async function sendCommand(command) {

        if (
            !controlCharacteristic
        ) {

            statusElement.innerHTML =
                "🔴 Not connected";

            return;
        }


        try {

            const data =
                new Uint8Array([
                    command
                ]);


            // Prefer write without response
            // because your ESP32 characteristic
            // supports PROPERTY_WRITE_NR.

            if (
                typeof controlCharacteristic
                    .writeValueWithoutResponse
                === "function"
            ) {

                await controlCharacteristic
                    .writeValueWithoutResponse(
                        data
                    );

            }

            else {

                await controlCharacteristic
                    .writeValue(
                        data
                    );

            }


            console.log(
                "Sent BLE command:",
                command
            );


            // Small visual feedback
            if (command === 1) {

                volumeDisplay.innerHTML =
                    "Volume increased";

            }

            else if (
                command === 2
            ) {

                volumeDisplay.innerHTML =
                    "Volume decreased";

            }

        }

        catch (error) {

            console.error(
                "BLE write error:",
                error
            );


            statusElement.innerHTML =
                "⚠️ Command failed";

        }
    }


    // ==================================================
    // Mute
    // ==================================================

    async function toggleMute() {

        if (!muted) {

            // Command 4 = force mute
            await sendCommand(4);

            muted = true;

            muteButton.innerHTML =
                "UNMUTE";

            muteButton.classList.add(
                "muted"
            );

            volumeDisplay.innerHTML =
                "Muted";

        }

        else {

            // Command 5 = force unmute
            await sendCommand(5);

            muted = false;

            muteButton.innerHTML =
                "MUTE";

            muteButton.classList.remove(
                "muted"
            );

            volumeDisplay.innerHTML =
                "Audio active";

        }
    }


    // ==================================================
    // Disconnect
    // ==================================================

    function handleDisconnect() {

        console.log(
            "BLE disconnected"
        );


        server =
            null;

        controlCharacteristic =
            null;


        statusElement.innerHTML =
            "🔴 Disconnected";


        volumeDisplay.innerHTML =
            "Press CONNECT";


        connectButton.innerHTML =
            "CONNECT";

        connectButton.disabled =
            false;


        disableControls();


        muted = false;

        muteButton.innerHTML =
            "MUTE";

        muteButton.classList.remove(
            "muted"
        );
    }


    // ==================================================
    // Enable controls
    // ==================================================

    function enableControls() {

        volumeUpButton.disabled =
            false;

        volumeDownButton.disabled =
            false;

        muteButton.disabled =
            false;
    }


    // ==================================================
    // Disable controls
    // ==================================================

    function disableControls() {

        volumeUpButton.disabled =
            true;

        volumeDownButton.disabled =
            true;

        muteButton.disabled =
            true;
    }


    // ==================================================
    // Prevent scrolling / dragging
    // ==================================================

    document.addEventListener(

        "touchmove",

        function(event) {

            event.preventDefault();

        },

        {
            passive: false
        }

    );


    // Prevent double-tap zoom behavior
    document.addEventListener(

        "dblclick",

        function(event) {

            event.preventDefault();

        }

    );

</script>

</body>

</html>
